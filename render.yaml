# Render deploy (free plan): Dashboard → New → Blueprint → select this repo.
# The free plan has no persistent disk, so the SQLite file lives on the container's
# local filesystem: documents reset when the service restarts or redeploys.
# Demo users are re-seeded automatically on every start.
# For durable data: switch to a paid plan and uncomment the disk block.
services:
  - type: web
    name: docs-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /data/docs.db
