# Netlify: static React build + the Express API as a single Netlify Function.
# Required environment variable (Site configuration → Environment variables):
#   DATABASE_URL = Supabase Postgres connection string (transaction pooler, port 6543)

[build]
  command = "npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix backend run build:netlify"
  publish = "frontend/dist"
  functions = "netlify/functions"   # generated by build:netlify (single self-contained bundle)

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "zisi"             # api.js is already bundled by esbuild; just zip it

# All API calls go to the function; the app keeps calling /api/... unchanged.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
